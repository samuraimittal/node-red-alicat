<script src="resources/@samuraimittal/node-red-alicat/alicat-editor.js"></script>
<script src="resources/@samuraimittal/node-red-alicat/alicat-control.js"></script>

<script type="text/html" data-template-name="alicat-control">
    <div class="form-row">
        <label for="node-input-device"><i class="fa fa-plug"></i> <span data-i18n="@samuraimittal/node-red-alicat/alicat-device:alicat.label.device"></span></label>
        <input type="text" id="node-input-device">
    </div>
    <div class="form-row">
        <label for="node-input-interval"><i class="fa fa-clock-o"></i> <span data-i18n="alicat-control.label.interval"></span></label>
        <input type="text" id="node-input-interval" style="width:80px"> <span data-i18n="alicat-control.unit.ms"></span>
    </div>
    <div class="form-row">
        <label for="node-input-tolerance" data-i18n="alicat-control.label.tolerance"></label>
        <input type="text" id="node-input-tolerance" style="width:80px" data-i18n="[placeholder]alicat-control.placeholder.tolerance">
        <span style="opacity:.7" data-i18n="alicat-control.tip.tolerance"></span>
    </div>
    <div class="form-row">
        <label for="node-input-correctionMs" data-i18n="alicat-control.label.correctionMs"></label>
        <input type="text" id="node-input-correctionMs" style="width:80px"> <span data-i18n="alicat-control.unit.doubling"></span>
    </div>
    <div class="form-row">
        <label for="node-input-maxAttempts" data-i18n="alicat-control.label.maxAttempts"></label>
        <input type="text" id="node-input-maxAttempts" style="width:60px"> <span data-i18n="alicat-control.unit.attempts"></span>
    </div>
    <div class="form-row">
        <label for="node-input-onExternalChange" data-i18n="alicat-control.label.onExternalChange"></label>
        <select id="node-input-onExternalChange">
            <option value="revert" data-i18n="alicat-control.onExternalChange.revert"></option>
            <option value="adopt" data-i18n="alicat-control.onExternalChange.adopt"></option>
            <option value="report" data-i18n="alicat-control.onExternalChange.report"></option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-switchMode" data-i18n="alicat-control.label.switchMode"></label>
        <select id="node-input-switchMode">
            <option value="bumpless" data-i18n="alicat-control.switchMode.bumpless"></option>
            <option value="direct" data-i18n="alicat-control.switchMode.direct"></option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> <span data-i18n="node-red:common.label.name"></span></label>
        <input type="text" id="node-input-name" data-i18n="[placeholder]node-red:common.label.name">
    </div>
</script>
