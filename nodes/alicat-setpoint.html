<script src="resources/@samuraimittal/node-red-alicat/alicat-editor.js"></script>
<script src="resources/@samuraimittal/node-red-alicat/alicat-setpoint.js"></script>

<script type="text/html" data-template-name="alicat-setpoint">
    <div class="form-row">
        <label for="node-input-device"><i class="fa fa-plug"></i> <span data-i18n="@samuraimittal/node-red-alicat/alicat-device:alicat.label.device"></span></label>
        <input type="text" id="node-input-device">
    </div>
    <div class="form-row">
        <label for="node-input-value"><i class="fa fa-crosshairs"></i> <span data-i18n="alicat-setpoint.label.value"></span></label>
        <input type="text" id="node-input-value" style="width:70%">
        <input type="hidden" id="node-input-valueType">
    </div>
    <div class="form-row">
        <label for="node-input-variable"><i class="fa fa-sliders"></i> <span data-i18n="alicat-setpoint.label.variable"></span></label>
        <select id="node-input-variable">
            <option value="current" data-i18n="alicat-setpoint.variable.current"></option>
            <option value="massFlow" data-i18n="alicat-setpoint.variable.massFlow"></option>
            <option value="volumetricFlow" data-i18n="alicat-setpoint.variable.volumetricFlow"></option>
            <option value="absolutePressure" data-i18n="alicat-setpoint.variable.absolutePressure"></option>
            <option value="gaugePressure" data-i18n="alicat-setpoint.variable.gaugePressure"></option>
            <option value="differentialPressure" data-i18n="alicat-setpoint.variable.differentialPressure"></option>
            <option value="valveDrive" data-i18n="alicat-setpoint.variable.valveDrive"></option>
            <option value="msg" data-i18n="alicat-setpoint.variable.msg"></option>
        </select>
    </div>
    <div class="form-row" id="alicat-switch-row">
        <label for="node-input-switchMode" data-i18n="alicat-setpoint.label.switchMode"></label>
        <select id="node-input-switchMode">
            <option value="bumpless" data-i18n="alicat-setpoint.switchMode.bumpless"></option>
            <option value="direct" data-i18n="alicat-setpoint.switchMode.direct"></option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-outOfRange" data-i18n="alicat-setpoint.label.outOfRange"></label>
        <select id="node-input-outOfRange">
            <option value="reject" data-i18n="alicat-setpoint.outOfRange.reject"></option>
            <option value="clamp" data-i18n="alicat-setpoint.outOfRange.clamp"></option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-verify" data-i18n="alicat-setpoint.label.verify"></label>
        <input type="checkbox" id="node-input-verify" style="width:auto">
        <label for="node-input-verify" style="width:auto" data-i18n="alicat-setpoint.tip.verify"></label>
    </div>
    <div class="form-row">
        <label for="node-input-savePowerUp" data-i18n="alicat-setpoint.label.savePowerUp"></label>
        <input type="checkbox" id="node-input-savePowerUp" style="width:auto">
        <label for="node-input-savePowerUp" style="width:auto" data-i18n="alicat-setpoint.tip.savePowerUp"></label>
    </div>
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> <span data-i18n="node-red:common.label.name"></span></label>
        <input type="text" id="node-input-name" data-i18n="[placeholder]node-red:common.label.name">
    </div>
</script>
