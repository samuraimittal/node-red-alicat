<script src="resources/@samuraimittal/node-red-alicat/alicat-editor.js"></script>
<script src="resources/@samuraimittal/node-red-alicat/alicat-pid.js"></script>

<script type="text/html" data-template-name="alicat-pid">
    <div class="form-row">
        <label for="node-input-device"><i class="fa fa-plug"></i> <span data-i18n="@samuraimittal/node-red-alicat/alicat-device:alicat.label.device"></span></label>
        <input type="text" id="node-input-device">
    </div>
    <div class="form-row">
        <label for="node-input-action"><i class="fa fa-sliders"></i> <span data-i18n="alicat-pid.label.action"></span></label>
        <select id="node-input-action">
            <option value="read" data-i18n="alicat-pid.action.read"></option>
            <option value="write" data-i18n="alicat-pid.action.write"></option>
            <option value="algorithm" data-i18n="alicat-pid.action.algorithm"></option>
        </select>
    </div>
    <div id="alicat-gains">
        <div class="form-row">
            <label for="node-input-pGain" data-i18n="alicat-pid.label.pGain"></label>
            <input type="text" id="node-input-pGain" style="width:70%"><input type="hidden" id="node-input-pGainType">
        </div>
        <div class="form-row">
            <label for="node-input-dGain" data-i18n="alicat-pid.label.dGain"></label>
            <input type="text" id="node-input-dGain" style="width:70%"><input type="hidden" id="node-input-dGainType">
        </div>
        <div class="form-row">
            <label for="node-input-iGain" data-i18n="alicat-pid.label.iGain"></label>
            <input type="text" id="node-input-iGain" style="width:70%"><input type="hidden" id="node-input-iGainType">
        </div>
        <div class="form-tips" data-i18n="alicat-pid.tip.gains"></div>
    </div>
    <div class="form-row" id="alicat-algorithm-row">
        <label for="node-input-algorithm" data-i18n="alicat-pid.label.algorithm"></label>
        <select id="node-input-algorithm">
            <option value="PDF" data-i18n="alicat-pid.algorithm.PDF"></option>
            <option value="PD2I" data-i18n="alicat-pid.algorithm.PD2I"></option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> <span data-i18n="node-red:common.label.name"></span></label>
        <input type="text" id="node-input-name" data-i18n="[placeholder]node-red:common.label.name">
    </div>
</script>
