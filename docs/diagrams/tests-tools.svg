<polyline points="3604,6252 3556,6235" fill="none" stroke="#c2255c" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="2 5" marker-end="url(#head-drives)"/>
<polyline points="3604,6390 3556,6323" fill="none" stroke="#c2255c" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="2 5" marker-end="url(#head-drives)"/>
<polyline points="3604,6520 3556,6410" fill="none" stroke="#c2255c" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="2 5" marker-end="url(#head-drives)"/>
