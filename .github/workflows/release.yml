name: Release

# Publishes to npm when a version tag (v1.2.3) is pushed. Uses npm trusted
# publishing (OIDC), so no npm token is stored; configure the trusted publisher
# on npmjs.com and protect the "npm" environment with a required reviewer.
# The first version was published by hand, since npm only lets a trusted publisher be set on an existing package.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm audit signatures
      # Lint, typechecks, tests with coverage, the runtime smoke test and the pack-list check.
      - run: npm run check
      - name: Tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Skip a version that is already on npm
        id: published
        run: |
          if npm view "$(node -p "require('./package.json').name")@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "Already on npm; nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.skip != 'true'
        run: npm publish --provenance --access public
